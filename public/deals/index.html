<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Current opportunities">
<title>Current opportunities</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff;color:#646F8E;font:400 14px/20px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}</style>
</head>
<body>
<p id="m">Loading…</p>
<script>
// Opens a shared deal page: /deals/?<12-character code>. The page is stored by that code; each stored page starts
// with its expiry, and an expired or removed page shows a short message instead.
(function () {
  var m = document.getElementById('m');
  var id = (location.search.match(/^\?([A-Za-z0-9]{12})(?:&|$)/) || [])[1];
  if (!id) { m.textContent = 'Page not found.'; return; }
  fetch('https://figvonwrlcpveyceengf.supabase.co/storage/v1/object/public/deal-pages/' + id + '.html?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('gone'); return r.text(); })
    .then(function (t) {
      var x = t.match(/^<!--expires:([^>]+)-->\n/);
      if (!x || !(Date.parse(x[1]) > Date.now())) { m.textContent = 'This link has expired.'; return; }
      var html = t.slice(x[0].length);
      if (!/^<!doctype html>/i.test(html)) throw new Error('bad page');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { m.textContent = 'This link is no longer available.'; });
})();
</script>
</body>
</html>
